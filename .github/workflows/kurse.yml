name: Kurse aktualisieren

on:
  schedule:
    - cron: "*/30 * * * 1-5"   # alle 30 Minuten, Montag bis Freitag (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tickers.json
      - .github/scripts/kurse.py
      - .github/workflows/kurse.yml

permissions:
  contents: write

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  kurse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python .github/scripts/kurse.py
      # prices.json landet auf dem eigenen Branch "kurse" (ein einziger Commit, wird jedes Mal ersetzt),
      # damit main nicht mit Kurs-Commits zugemüllt wird. Die Seite lädt die Datei über raw.githubusercontent.com.
      - name: Auf Branch kurse veröffentlichen
        run: |
          mkdir /tmp/out && cp prices.json /tmp/out/
          cd /tmp/out
          git init -q -b kurse
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -q -m "Kurse $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" kurse
