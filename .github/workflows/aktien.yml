name: Aktien-Level aktualisieren

on:
  schedule:
    - cron: "17 7-21 * * 1-5"   # stündlich von 7 bis 21 Uhr UTC, Montag bis Freitag
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - aktien/liste.json
      - .github/scripts/aktien.py
      - .github/workflows/aktien.yml

permissions:
  contents: write

concurrency:
  group: aktien
  cancel-in-progress: false

jobs:
  aktien:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python .github/scripts/aktien.py
      # aktien.json landet auf dem eigenen Branch "aktien-daten" (ein einziger Commit, wird jedes Mal ersetzt).
      - name: Auf Branch aktien-daten veröffentlichen
        run: |
          mkdir /tmp/out && cp aktien.json /tmp/out/
          cd /tmp/out
          git init -q -b aktien-daten
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aktien.json
          git commit -q -m "Aktien $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" aktien-daten
